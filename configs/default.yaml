# Training config for one band-pair model. Run train.py three times, once
# per pair (--pair blue|green|red), to produce all checkpoints.

data_root: data/superdove           # directory containing 8-band scene GeoTIFFs
scene_glob: "*.tif"                 # recursive glob under data_root
checkpoint_dir: checkpoints
seed: 0
device: cuda                        # auto-falls back to cpu if no GPU
amp: true                           # mixed precision

use_red_edge: false                 # true → red channel uses Red+RedEdge instead of Red+Yellow

# Wald's-protocol degradation settings
wald:
  chip_size: 128
  scale: 2
  product: toar                     # "toar" parses XML sidecar per scene; "sr" uses 1/10000
  blur_sigma: 1.0
  max_subpixel_jitter: 0.5          # simulate inter-band offset that survives L1B
  chips_per_scene: 64
  augment: true

# Optimization
batch_size: 16
num_workers: 4
epochs: 50
lr: 1.0e-4
lr_min: 1.0e-6
weight_decay: 0.0
val_split: 0.05

# Loss weights
l1_weight: 1.0
lpips_weight: 0.1                   # 0 disables LPIPS (and removes the lpips dep at runtime)
