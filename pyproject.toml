[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "superdove-superres"
version = "0.1.0"
description = "Per-pair super-resolution RGB synthesis from SuperDove 8-band imagery"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "numpy>=1.24",
    "rasterio>=1.3",
    "scikit-image>=0.22",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "lpips>=0.1.4",
    "tifffile>=2024.1.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]

[project.scripts]
superdove-train = "superres.train:main"
superdove-infer = "superres.infer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
